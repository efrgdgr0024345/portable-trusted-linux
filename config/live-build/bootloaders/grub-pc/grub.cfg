# Black Cat live image boot menu (GRUB / UEFI).
# live-build replaces the @...@ placeholders during image construction.

source /boot/grub/config.cfg
set default=0
set timeout=15

# Cosmetic branding only. GRUB's background_image command stretches the image
# to the active gfxterm display by default. If PNG/gfxterm rendering is not
# available on a machine, these commands are allowed to fail and the normal
# text menu remains usable.
insmod png 2>/dev/null || true
background_image /boot/grub/blackcat.png 2>/dev/null || true
set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "Black Cat - Start" --hotkey=b {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry "Black Cat - System Check (no typing)" --hotkey=c {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ blackcat.check=1
    initrd @INITRD_LIVE@
}

submenu "Black Cat - Advanced options" {
    @LINUX_LIVE@
}
