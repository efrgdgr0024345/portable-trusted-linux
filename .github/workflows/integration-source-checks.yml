name: Black Cat Integration Source Checks
on:
  push:
    branches: [codex/graphical-evidence-review]
    paths: ['web/**', 'tests/**', 'design/**', 'project_content.json', '.github/workflows/integration-source-checks.yml']
permissions:
  contents: read
concurrency:
  group: blackcat-integration-source-checks
  cancel-in-progress: false
jobs:
  source:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Existing source and negative signing checks
        run: |
          bash tests/00-static-check.sh
          bash tests/01-release-signing-check.sh
          bash tests/02-session-ui-check.sh
          bash tests/10-blackcat-console-static.sh
      - name: Lint and test viewer with local fixtures
        run: python3 tests/04-review-source.py
