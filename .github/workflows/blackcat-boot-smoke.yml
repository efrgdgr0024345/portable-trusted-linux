name: Black Cat Boot Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'build/**'
      - 'config/**'
      - '.github/workflows/blackcat-boot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build on Debian 13 and boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Black Cat inside disposable Debian 13
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf out artifacts/smoke-hosted smoke || true
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e PTL_BUILD_WORK_DIR=/var/tmp/blackcat-hosted-smoke-build \
            -e PTL_SOURCE_COMMIT='${{ github.event.pull_request.head.sha || github.sha }}' \
            -e PTL_SOURCE_REF='${{ github.head_ref || github.ref_name }}' \
            debian:trixie \
            bash -lc 'bash build/01-install-deps.sh && bash build/20-build-live.sh && bash build/30-artifact-manifest.sh'
          ls -lah out
          cat out/*.sha256

      - name: Install QEMU test tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf xorriso socat imagemagick tesseract-ocr

      - name: Inspect generated ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          [[ -n "$ISO" ]] || { echo 'No ISO was generated' >&2; exit 1; }
          mkdir -p smoke/mnt
          sudo mount -o loop,ro "$ISO" smoke/mnt
          trap 'sudo umount smoke/mnt 2>/dev/null || true' EXIT
          grep -RIna --include='*.cfg' 'Black Cat' smoke/mnt | tee smoke/menu-strings.txt
          grep -Riq --include='*.cfg' 'Black Cat - System Check' smoke/mnt
          KERNEL="$(find smoke/mnt/live -maxdepth 1 -type f -name 'vmlinuz*' -print -quit)"
          INITRD="$(find smoke/mnt/live -maxdepth 1 -type f \( -name 'initrd*' -o -name 'initrd.img*' \) -print -quit)"
          [[ -n "$KERNEL" && -n "$INITRD" ]] || { echo 'Kernel/initrd missing from ISO' >&2; exit 1; }
          cp "$KERNEL" smoke/vmlinuz
          cp "$INITRD" smoke/initrd.img
          sudo umount smoke/mnt
          trap - EXIT

      - name: Boot live userspace and require automatic Black Cat check
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          set +e
          timeout 180s qemu-system-x86_64 \
            -machine accel=tcg \
            -m 1536 \
            -kernel smoke/vmlinuz \
            -initrd smoke/initrd.img \
            -cdrom "$ISO" \
            -append 'boot=live components blackcat.check=1 console=ttyS0,115200' \
            -nographic \
            -no-reboot \
            > smoke/live-serial.log 2>&1
          rc=$?
          set -e
          echo "QEMU_EXIT=$rc"
          tail -n 180 smoke/live-serial.log || true
          grep -Fq 'BLACK CAT - QUICK CHECK' smoke/live-serial.log || {
            echo 'Automatic Black Cat quick-check marker was not observed.' >&2
            exit 1
          }
          grep -Fq 'BLACK CAT VM BOOT SMOKE TEST: PASS' smoke/live-serial.log || true
          echo 'BLACK CAT LIVE USERSPACE BOOT: PASS'

      - name: UEFI boot the ISO and capture framebuffer evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          CODE="$(find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit)"
          [[ -n "$CODE" ]] || { echo 'OVMF code firmware not found' >&2; exit 1; }

          VARS_TEMPLATE=''
          if [[ "$CODE" == *'_4M.fd' ]]; then
            VARS_TEMPLATE="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS_4M.fd' -print -quit)"
          else
            VARS_TEMPLATE="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS.fd' -print -quit)"
          fi
          [[ -n "$VARS_TEMPLATE" ]] || { echo 'Matching OVMF variable store not found' >&2; exit 1; }
          cp "$VARS_TEMPLATE" smoke/OVMF_VARS.fd

          rm -f smoke/qemu-monitor smoke/qemu.pid
          set +e
          qemu-system-x86_64 \
            -machine accel=tcg \
            -m 1024 \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=smoke/OVMF_VARS.fd \
            -cdrom "$ISO" \
            -boot d \
            -display none \
            -serial file:smoke/uefi-serial.log \
            -monitor unix:smoke/qemu-monitor,server,nowait \
            -D smoke/qemu-debug.log \
            -no-reboot \
            >smoke/qemu-stdout.log 2>smoke/qemu-stderr.log &
          QPID=$!
          set -e
          echo "$QPID" > smoke/qemu.pid

          for i in $(seq 1 20); do
            [[ -S smoke/qemu-monitor ]] && break
            kill -0 "$QPID" 2>/dev/null || break
            sleep 1
          done

          if ! kill -0 "$QPID" 2>/dev/null; then
            echo 'QEMU exited during UEFI boot.' >&2
            cat smoke/qemu-stderr.log >&2 || true
            exit 1
          fi
          [[ -S smoke/qemu-monitor ]] || {
            echo 'QEMU monitor socket was not created.' >&2
            cat smoke/qemu-stderr.log >&2 || true
            kill "$QPID" 2>/dev/null || true
            exit 1
          }

          sleep 12
          printf 'info status\n' | socat - UNIX-CONNECT:smoke/qemu-monitor | tee smoke/qemu-status.txt
          printf 'screendump smoke/uefi-menu.ppm\n' | socat - UNIX-CONNECT:smoke/qemu-monitor
          sleep 2
          printf 'quit\n' | socat - UNIX-CONNECT:smoke/qemu-monitor || true
          wait "$QPID" 2>/dev/null || true

          test -s smoke/uefi-menu.ppm || {
            echo 'UEFI framebuffer capture was not produced.' >&2
            cat smoke/qemu-stderr.log >&2 || true
            exit 1
          }
          convert smoke/uefi-menu.ppm smoke/uefi-menu.png
          tesseract smoke/uefi-menu.png stdout > smoke/uefi-menu-ocr.txt 2>/dev/null || true
          echo '--- UEFI framebuffer OCR (informational) ---'
          cat smoke/uefi-menu-ocr.txt || true
          echo 'BLACK CAT UEFI ISO BOOT: PASS'

      - name: Preserve smoke-test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: blackcat-hosted-boot-smoke-${{ github.run_id }}
          path: |
            out/*.sha256
            out/build-manifest.json
            smoke/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
