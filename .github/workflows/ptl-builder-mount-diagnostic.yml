name: PTL Builder Mount Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ptl-builder-mount-diagnostic.yml'

permissions:
  contents: read

jobs:
  mount-diagnostic:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect build filesystem mount options
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- /tmp ---'
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo '--- /var/tmp ---'
          findmnt -T /var/tmp -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo '--- runner checkout root ---'
          findmnt -T /home/github-runner/actions-runner/_work -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo '--- mknod capability probes ---'
          probe_tmp="/tmp/ptl-mknod-probe-$$"
          probe_var="/var/tmp/ptl-mknod-probe-$$"
          if mknod "$probe_tmp" c 1 3 2>&1; then echo 'TMP_MKNOD=OK'; rm -f "$probe_tmp"; else echo 'TMP_MKNOD=FAILED'; fi
          if mknod "$probe_var" c 1 3 2>&1; then echo 'VAR_TMP_MKNOD=OK'; rm -f "$probe_var"; else echo 'VAR_TMP_MKNOD=FAILED'; fi
