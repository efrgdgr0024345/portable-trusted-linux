name: PTL First Builder Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ptl-first-builder-evidence.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This job is read-only and quick, so only the newest PR revision needs to run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-builder-evidence:
    name: First real builder evidence
    # Legacy entry point retired: use trusted main M15 workflow.
    if: ${{ false }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Confirm runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "ARCH=$(uname -m)"
          echo "KERNEL=$(uname -sr)"
          echo "WORKSPACE=$GITHUB_WORKSPACE"

      - name: Run repository static checks
        run: |
          bash tests/00-static-check.sh
          bash tests/10-blackcat-console-static.sh

      - name: Run first real builder report
        shell: bash
        run: |
          set -Eeuo pipefail
          bash build/05-first-run-report.sh

      - name: Independently verify Ubuntu 26.04.1 recovery ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE="26.04"
          ISO="ubuntu-26.04.1-desktop-amd64.iso"
          BASE="https://releases.ubuntu.com/${RELEASE}"
          EXPECTED_CDIMAGE_FPR="843938DF228D22F7B3742BC0D94AA3F0EFE21092"
          WORK="${RUNNER_TEMP}/ubuntu-recovery-verify"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          curl --fail --location --proto '=https' --tlsv1.2 -o ubuntu-archive-keyring.gpg             "https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg"
          curl --fail --location --proto '=https' --tlsv1.2 -O "${BASE}/SHA256SUMS"
          curl --fail --location --proto '=https' --tlsv1.2 -O "${BASE}/SHA256SUMS.gpg"

          ACTUAL_FPRS="$(gpg --batch --no-default-keyring --keyring ./ubuntu-archive-keyring.gpg --with-colons --fingerprint 2>/dev/null | awk -F: '$1=="fpr"{print $10}')"
          printf '%s\n' "$ACTUAL_FPRS"
          grep -qx "$EXPECTED_CDIMAGE_FPR" <<<"$ACTUAL_FPRS"

          gpgv --keyring ./ubuntu-archive-keyring.gpg ./SHA256SUMS.gpg ./SHA256SUMS

          EXPECTED_LINE="$(grep -F " $ISO" SHA256SUMS || true)"
          if [ -z "$EXPECTED_LINE" ]; then
            EXPECTED_LINE="$(grep -F "*$ISO" SHA256SUMS || true)"
          fi
          test -n "$EXPECTED_LINE"
          echo "$EXPECTED_LINE"
          EXPECTED_SHA="$(awk '{print $1}' <<<"$EXPECTED_LINE")"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 5             -o "$ISO" "${BASE}/${ISO}"
          ACTUAL_SHA="$(sha256sum "$ISO" | awk '{print $1}')"
          echo "$ACTUAL_SHA  $ISO"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          stat -c '%s bytes %n' "$ISO"
          echo "PASS"
          echo "sha256=${ACTUAL_SHA}"
          echo "ubuntu_cdimage_key_fingerprint=${EXPECTED_CDIMAGE_FPR}"

      - name: Show generated evidence files
        if: always()
        shell: bash
        run: |
          echo "Generated host-check evidence:"
          find artifacts/host-checks -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
