name: Verify Ubuntu 26.04.1 recovery ISO

on:
  push:
    branches:
      - recovery-verify-ubuntu-26041
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify Ubuntu signing key and ISO
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="26.04"
          ISO="ubuntu-26.04.1-desktop-amd64.iso"
          BASE="https://releases.ubuntu.com/${RELEASE}"
          EXPECTED_CDIMAGE_FPR="843938DF228D22F7B3742BC0D94AA3F0EFE21092"

          mkdir -p verify && cd verify

          echo "=== Download verification material ==="
          curl --fail --location --proto '=https' --tlsv1.2             -o ubuntu-archive-keyring.gpg             "https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg"
          curl --fail --location --proto '=https' --tlsv1.2 -O "${BASE}/SHA256SUMS"
          curl --fail --location --proto '=https' --tlsv1.2 -O "${BASE}/SHA256SUMS.gpg"

          echo "=== Check Canonical image-signing key fingerprint ==="
          ACTUAL_FPRS="$(
            gpg --batch --no-default-keyring               --keyring ./ubuntu-archive-keyring.gpg               --with-colons --fingerprint 2>/dev/null |
            awk -F: '$1=="fpr"{print $10}'
          )"
          printf '%s\n' "$ACTUAL_FPRS"
          if ! grep -qx "$EXPECTED_CDIMAGE_FPR" <<<"$ACTUAL_FPRS"; then
            echo "ERROR: expected Ubuntu CD Image signing fingerprint not present" >&2
            exit 1
          fi

          echo "=== Verify signed SHA256SUMS ==="
          gpgv --keyring ./ubuntu-archive-keyring.gpg ./SHA256SUMS.gpg ./SHA256SUMS

          echo "=== Expected ISO checksum from signed manifest ==="
          EXPECTED_LINE="$(grep " *{0,1}${ISO}$" SHA256SUMS || true)"
          if [ -z "$EXPECTED_LINE" ]; then
            echo "ERROR: ISO not present in signed SHA256SUMS" >&2
            exit 1
          fi
          echo "$EXPECTED_LINE"
          EXPECTED_SHA="$(awk '{print $1}' <<<"$EXPECTED_LINE")"

          echo "=== Download ISO ==="
          curl --fail --location --proto '=https' --tlsv1.2             --retry 3 --retry-delay 5             -o "$ISO" "${BASE}/${ISO}"

          echo "=== Locally calculated checksum ==="
          ACTUAL_SHA="$(sha256sum "$ISO" | awk '{print $1}')"
          echo "$ACTUAL_SHA  $ISO"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "=== File size ==="
          stat -c '%s bytes %n' "$ISO"

          echo "=== Verification result ==="
          echo "PASS"
          echo "release=${RELEASE}"
          echo "iso=${ISO}"
          echo "sha256=${ACTUAL_SHA}"
          echo "ubuntu_cdimage_key_fingerprint=${EXPECTED_CDIMAGE_FPR}"
